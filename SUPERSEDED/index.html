<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta
			name="viewport"
			content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<link rel="stylesheet" href="css/leaflet.css" />
		<link rel="stylesheet" href="css/L.Control.Layers.Tree.css" />
		<link rel="stylesheet" href="css/qgis2web.css" />
		<link rel="stylesheet" href="css/fontawesome-all.min.css" />
		<link rel="stylesheet" href="css/leaflet.photon.css" />
		<link rel="stylesheet" href="css/custom.css" />
		<title>VN-DRAW Drought Risk Assessment</title>
	</head>
	<body>
		<div id="header">
			<h1>VN-DRAW: Drought Risk Assessment</h1>
		</div>
		<div id="sidebar">
			<h2>Drought Risk</h2>
			<label for="year">Select year</label>
			<select id="year">
				<option value="2020">2020</option>
			</select>
			<h3>DRI Classification</h3>
			<div class="legend-item">
				<div class="legend-colour" style="background: #1a9641"></div>
				<span>Very Low</span>
			</div>
			<div class="legend-item">
				<div class="legend-colour" style="background: #a6d96a"></div>
				<span>Low</span>
			</div>
			<div class="legend-item">
				<div class="legend-colour" style="background: #ffffc0"></div>
				<span>Moderate</span>
			</div>
			<div class="legend-item">
				<div class="legend-colour" style="background: #fdae61"></div>
				<span>High</span>
			</div>
			<div class="legend-item">
				<div class="legend-colour" style="background: #d7191c"></div>
				<span>Very High</span>
			</div>
			<div id="download-section">
				<h3>Download Data</h3>
				<a href="downloads/VN_DRAW_DRI_2020.geojson" download class="download-btn geojson">
					GeoJSON
				</a>
				<a href="downloads/VN_DRAW_DRI_2020.csv" download class="download-btn csv"> CSV </a>
				<a href="downloads/VN_DRAW_Metadata.pdf" target="_blank" class="download-btn pdf">
					Metadata (PDF)
				</a>
			</div>
		</div>
		<div id="map"></div>

		<script src="js/qgis2web_expressions.js"></script>
		<script src="js/leaflet.js"></script>
		<script src="js/L.Control.Layers.Tree.min.js"></script>
		<script src="js/leaflet.rotatedMarker.js"></script>
		<script src="js/leaflet.pattern.js"></script>
		<script src="js/leaflet-hash.js"></script>
		<script src="js/Autolinker.min.js"></script>
		<script src="js/rbush.min.js"></script>
		<script src="js/labelgun.min.js"></script>
		<script src="js/labels.js"></script>
		<script src="js/leaflet.photon.js"></script>
		<script src="data/DRI_2020_1.js"></script>
		<script>
			var map = L.map('map', {
				zoomControl: false,
				maxZoom: 28,
				minZoom: 1
			}).fitBounds([
				[7.8910407054327525, 93.08914151330195],
				[24.91287850308276, 120.19799430215197]
			]);
			var hash = new L.Hash(map);
			map.attributionControl.setPrefix(
				'<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>'
			);
			var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });
			// remove popup's row if "visible-with-data"
			function removeEmptyRowsFromPopupContent(content, feature) {
				var tempDiv = document.createElement('div');
				tempDiv.innerHTML = content;
				var rows = tempDiv.querySelectorAll('tr');
				for (var i = 0; i < rows.length; i++) {
					var td = rows[i].querySelector('td.visible-with-data');
					var key = td ? td.id : '';
					if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
						rows[i].parentNode.removeChild(rows[i]);
					}
				}
				return tempDiv.innerHTML;
			}
			// modify popup if contains media
			function addClassToPopupIfMedia(content, popup) {
				var tempDiv = document.createElement('div');
				tempDiv.innerHTML = content;
				var imgTd = tempDiv.querySelector('td img');
				if (imgTd) {
					var src = imgTd.getAttribute('src');
					if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
						popup._contentNode.classList.add('media');
						var img = popup._contentNode.querySelector('td img');
						if (img) {
							// If already loaded (cache), update immediately
							if (img.complete && img.naturalHeight > 0) {
								popup.update();
							} else {
								img.addEventListener('load', function () {
									popup.update();
								});
								img.addEventListener('error', function () {
									popup.update();
								});
							}
						}
					} else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
						var audio = document.createElement('audio');
						audio.controls = true;
						audio.src = src;
						imgTd.parentNode.replaceChild(audio, imgTd);
						popup._contentNode.classList.add('media');
						setTimeout(function () {
							popup.setContent(tempDiv.innerHTML);
							popup.update();
						}, 10);
					} else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
						var video = document.createElement('video');
						video.controls = true;
						video.src = src;
						video.style.width = '400px';
						video.style.height = '300px';
						video.style.maxHeight = '60vh';
						video.style.maxWidth = '60vw';
						imgTd.parentNode.replaceChild(video, imgTd);
						popup._contentNode.classList.add('media');
						// Aggiorna il popup quando il video carica i metadati
						video.addEventListener('loadedmetadata', function () {
							popup.update();
						});
						setTimeout(function () {
							popup.setContent(tempDiv.innerHTML);
							popup.update();
						}, 10);
					} else {
						popup._contentNode.classList.remove('media');
					}
				} else {
					popup._contentNode.classList.remove('media');
				}
			}
			var zoomControl = L.control
				.zoom({
					position: 'topleft'
				})
				.addTo(map);
			var bounds_group = new L.featureGroup([]);
			function setBounds() {}
			map.createPane('pane_EsriWorldImagery_0');
			map.getPane('pane_EsriWorldImagery_0').style.zIndex = 400;
			var layer_EsriWorldImagery_0 = L.tileLayer(
				'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
				{
					pane: 'pane_EsriWorldImagery_0',
					opacity: 1.0,
					attribution: '',
					minZoom: 1,
					maxZoom: 28,
					minNativeZoom: 0,
					maxNativeZoom: 18
				}
			);
			layer_EsriWorldImagery_0;
			map.addLayer(layer_EsriWorldImagery_0);
			function pop_DRI_2020_1(feature, layer) {
				var dri = Number(feature.properties['Constant_yearlyDRI15to22_DRI2020']);

				var riskCategory = '';

				if (dri < 0.3) {
					riskCategory = 'Very Low';
				} else if (dri < 0.4) {
					riskCategory = 'Low';
				} else if (dri < 0.5) {
					riskCategory = 'Moderate';
				} else if (dri < 0.6) {
					riskCategory = 'High';
				} else {
					riskCategory = 'Very High';
				}

				var popupContent =
					'<div class="dri-popup">' +
					'<h3>Drought Risk</h3>' +
					'<div class="popup-row">' +
					'<strong>Area:</strong> ' +
					feature.properties['ADM1_EN'] +
					'</div>' +
					'<div class="popup-row">' +
					'<strong>DRI 2020:</strong> ' +
					dri.toFixed(2) +
					'</div>' +
					'<div class="popup-row">' +
					'<strong>Risk category:</strong> ' +
					riskCategory +
					'</div>' +
					'</div>';

				layer.bindPopup(popupContent, {
					maxWidth: 300
				});
			}
			function style_DRI_2020_1_0(feature) {
				if (
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] >= 0.28905 &&
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] <= 0.3
				) {
					return {
						pane: 'pane_DRI_2020_1',
						opacity: 1,
						color: 'rgba(35,35,35,1.0)',
						dashArray: '',
						lineCap: 'butt',
						lineJoin: 'miter',
						weight: 1.0,
						fill: true,
						fillOpacity: 1,
						fillColor: 'rgba(26,150,65,1.0)',
						interactive: true
					};
				}
				if (
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] >= 0.3 &&
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] <= 0.4
				) {
					return {
						pane: 'pane_DRI_2020_1',
						opacity: 1,
						color: 'rgba(35,35,35,1.0)',
						dashArray: '',
						lineCap: 'butt',
						lineJoin: 'miter',
						weight: 1.0,
						fill: true,
						fillOpacity: 1,
						fillColor: 'rgba(166,217,106,1.0)',
						interactive: true
					};
				}
				if (
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] >= 0.4 &&
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] <= 0.5
				) {
					return {
						pane: 'pane_DRI_2020_1',
						opacity: 1,
						color: 'rgba(35,35,35,1.0)',
						dashArray: '',
						lineCap: 'butt',
						lineJoin: 'miter',
						weight: 1.0,
						fill: true,
						fillOpacity: 1,
						fillColor: 'rgba(255,255,192,1.0)',
						interactive: true
					};
				}
				if (
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] >= 0.5 &&
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] <= 0.6
				) {
					return {
						pane: 'pane_DRI_2020_1',
						opacity: 1,
						color: 'rgba(35,35,35,1.0)',
						dashArray: '',
						lineCap: 'butt',
						lineJoin: 'miter',
						weight: 1.0,
						fill: true,
						fillOpacity: 1,
						fillColor: 'rgba(253,174,97,1.0)',
						interactive: true
					};
				}
				if (
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] >= 0.6 &&
					feature.properties['Constant_yearlyDRI15to22_DRI2020'] <= 1.0
				) {
					return {
						pane: 'pane_DRI_2020_1',
						opacity: 1,
						color: 'rgba(35,35,35,1.0)',
						dashArray: '',
						lineCap: 'butt',
						lineJoin: 'miter',
						weight: 1.0,
						fill: true,
						fillOpacity: 1,
						fillColor: 'rgba(215,25,28,1.0)',
						interactive: true
					};
				}
			}
			map.createPane('pane_DRI_2020_1');
			map.getPane('pane_DRI_2020_1').style.zIndex = 401;
			map.getPane('pane_DRI_2020_1').style['mix-blend-mode'] = 'normal';
			var layer_DRI_2020_1 = new L.geoJson(json_DRI_2020_1, {
				attribution: '',
				interactive: true,
				dataVar: 'json_DRI_2020_1',
				layerName: 'layer_DRI_2020_1',
				pane: 'pane_DRI_2020_1',
				onEachFeature: pop_DRI_2020_1,
				style: style_DRI_2020_1_0
			});
			bounds_group.addLayer(layer_DRI_2020_1);
			map.addLayer(layer_DRI_2020_1);
			setBounds();
		</script>
	</body>
</html>
